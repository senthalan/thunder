" width="575" height="66" rx="12" fill="none" class="surf"/><rect x="85" y="802" width="575" height="66" rx="12" fill="none" stroke="var(--acc-cfg)" stroke-width="1.4"/><text x="101" y="842" font-size="22" font-weight="700">Look and feel</text><text x="260" y="829" font-size="20" class="mut">Themes · Layouts · Translations</text><text x="85" y="900" font-size="20" class="mut it">Every row above is a YAML resource_type, versionable</text><text x="85" y="926" font-size="20" class="mut it">in Git.</text><rect x="730" y="432" width="575" height="92" rx="12" fill="none" class="surf"/><rect x="730" y="432" width="575" height="92" rx="12" fill="none" stroke="var(--acc-run)" stroke-width="1.4"/><text x="746" y="466" font-size="22" font-weight="700">OAuth 2.1 and OpenID Connect</text><text x="746" y="494" font-size="20" class="mut">authorize · token · PAR · PKCE · DPoP · CIBA ·</text><text x="746" y="519" font-size="20" class="mut">DCR · introspect · revocation · userinfo · JWKS</text><rect x="730" y="536" width="575" height="92" rx="12" fill="none" class="surf"/><rect x="730" y="536" width="575" height="92" rx="12" fill="none" stroke="var(--acc-run)" stroke-width="1.4"/><text x="746" y="570" font-size="22" font-weight="700">Identity journeys</text><text x="746" y="598" font-size="20" class="mut">POST /flow/execute · Gate login UI · sessions and</text><text x="746" y="623" font-size="20" class="mut">SSO</text><rect x="730" y="640" width="575" height="92" rx="12" fill="none" class="surf"/><rect x="730" y="640" width="575" height="92" rx="12" fill="none" stroke="var(--acc-run)" stroke-width="1.4"/><text x="746" y="674" font-size="22" font-weight="700">Authorization</text><text x="746" y="702" font-size="20" class="mut">AuthZEN PDP · access evaluation · batch</text><text x="746" y="727" font-size="20" class="mut">evaluation · action search · RBAC</text><rect x="730" y="744" width="575" height="92" rx="12" fill="none" class="surf"/><rect x="730" y="744" width="575" height="92" r