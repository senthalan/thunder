0">AI agents</text><text x="810" y="270" font-size="20" text-anchor="middle" class="mut">Copilots and autonomous workers,</text><text x="810" y="297" font-size="20" text-anchor="middle" class="mut">acting alone or for someone.</text><line x1="810" y1="342" x2="810" y2="398" class="hair dot" stroke-width="2.6"/><rect x="1100" y="70" width="460" height="260" rx="20" fill="var(--acc-dat)" fill-opacity="0.05"/><rect x="1100" y="70" width="460" height="260" rx="20" fill="none" stroke="var(--acc-dat)" stroke-width="2.5"/><rect x="1286" y="100" width="88" height="88" rx="24" fill="none" class="surf"/><rect x="1286" y="100" width="88" height="88" rx="24" fill="none" stroke="var(--acc-dat)" stroke-width="1.8"/><g transform="translate(1307,121) scale(1.9166666666666667)"><rect x="3.5" y="4" width="17" height="5.6" rx="1.8" fill="none" stroke="var(--acc-dat)" stroke-width="1.8"/><rect x="3.5" y="14.4" width="17" height="5.6" rx="1.8" fill="none" stroke="var(--acc-dat)" stroke-width="1.8"/><circle cx="7" cy="6.8" r="1.1" fill="var(--acc-dat)"/><circle cx="7" cy="17.2" r="1.1" fill="var(--acc-dat)"/></g><text x="1330" y="232" font-size="31" text-anchor="middle" style="fill:var(--acc-dat)" font-weight="700">Machines</text><text x="1330" y="270" font-size="20" text-anchor="middle" class="mut">Services, jobs, and integrations</text><text x="1330" y="297" font-size="20" text-anchor="middle" class="mut">that call your APIs.</text><line x1="1330" y1="342" x2="1330" y2="398" class="hair dot" stroke-width="2.6"/><rect x="60" y="410" width="1500" height="170" rx="20" fill="var(--acc-run)" fill-opacity="0.06"/><rect x="60" y="410" width="1500" height="170" rx="20" fill="none" stroke="var(--acc-run)" stroke-width="2.5"/><text x="810" y="466" font-size="32" text-anchor="middle" style="fill:var(--acc-run)" font-weight="700">All three are first-class identity types in ThunderID</text><rect x="120" y="498" width="440" height="52" rx="10" fill="none" class="surf"/><rect x="120" y="498" width="440" height="52" rx="10" fill="none" stroke="var(--acc-run)" stroke-width="1.6"/><text x="340" y="531" font-size="20" text-anchor="middle" font-weight="600">Managed in one directory</text><rect x="590" y="498" width="440" height="52" rx="10" fill="none" class="surf"/><rect x="590" y="498" width="440" height="52" rx="10" fill="none" stroke="var(--acc-run)" stroke-width="1.6"/><text x="810" y="531" font-size="20" text-anchor="middle" font-weight="600">Granted roles the same way</text><rect x="1060" y="498" width="440" height="52" rx="10" fill="none" class="surf"/><rect x="1060" y="498" width="440" height="52" rx="10" fill="none" stroke="var(--acc-run)" stroke-width="1.6"/><text x="1280" y="531" font-size="20" text-anchor="middle" font-weight="600">Accepted by your APIs the same way</text></svg>