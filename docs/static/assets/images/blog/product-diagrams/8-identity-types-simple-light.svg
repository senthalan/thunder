<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 640" width="1620" height="640" role="img" aria-label="People, AI agents, and machines are all first-class identities in ThunderID: managed in one directory, granted roles the same way, and accepted by your APIs the same way."><title>People, AI agents, and machines are all first-class identities in ThunderID: managed in one directory, granted roles the same way, and accepted by your APIs the same way.</title><style>
:root{--ink:#0f172a;--mut:#64748b;--surf:#ffffff;--line:#cbd5e1;--acc-cfg:#2563eb;--acc-run:#0d9488;--acc-vc:#059669;--acc-agt:#b45309;--acc-cry:#dc2626;--acc-dat:#0e7490;}
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: var(--ink); }
.mut { fill: var(--mut); }
.b { font-weight: 700; }
.sb { font-weight: 600; }
.it { font-style: italic; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surf { fill: var(--surf); }
.pill-bg { fill: var(--ink); }
.pill-tx { fill: var(--surf); font-weight: 600; }
.hair { stroke: var(--line); fill: none; }
.arrow { stroke: var(--ink); fill: none; stroke-width: 2.2; }
.arrow-mut { stroke: var(--mut); fill: none; stroke-width: 2; }
.dash { stroke-dasharray: 8 7; }
.dot { stroke-dasharray: 2 6; stroke-linecap: round; }
</style>
