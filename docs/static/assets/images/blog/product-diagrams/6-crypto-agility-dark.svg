328" width="1208" height="162" rx="20" fill="none" stroke="var(--acc-cry)" stroke-width="2.5"/><rect x="62" y="308" width="384.50600000000003" height="36" rx="18" fill="none" class="pill-bg"/><text x="78" y="333.7" font-size="22" class="pill-tx">Pluggable signing algorithms</text><line x1="804" y1="288" x2="804" y2="324" class="arrow-mut" marker-end="url(#ahm)"/><rect x="62" y="364" width="116" height="52" rx="10" fill="var(--mut)" fill-opacity="0.08"/><rect x="62" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--mut)" stroke-width="1.4"/><text x="120" y="396" font-size="19" text-anchor="middle" class="mono" font-weight="700">RS256</text><rect x="189" y="364" width="116" height="52" rx="10" fill="var(--mut)" fill-opacity="0.08"/><rect x="189" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--mut)" stroke-width="1.4"/><text x="247" y="396" font-size="19" text-anchor="middle" class="mono" font-weight="700">PS256</text><rect x="316" y="364" width="116" height="52" rx="10" fill="var(--mut)" fill-opacity="0.08"/><rect x="316" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--mut)" stroke-width="1.4"/><text x="374" y="396" font-size="19" text-anchor="middle" class="mono" font-weight="700">ES256</text><rect x="443" y="364" width="116" height="52" rx="10" fill="var(--mut)" fill-opacity="0.08"/><rect x="443" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--mut)" stroke-width="1.4"/><text x="501" y="396" font-size="19" text-anchor="middle" class="mono" font-weight="700">ES384</text><rect x="570" y="364" width="116" height="52" rx="10" fill="var(--mut)" fill-opacity="0.08"/><rect x="570" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--mut)" stroke-width="1.4"/><text x="628" y="396" font-size="19" text-anchor="middle" class="mono" font-weight="700">ES512</text><rect x="697" y="364" width="116" height="52" rx="10" fill="var(--mut)" fill-opacity="0.08"/><rect x="697" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--mut)" stroke-width="1.4"/><text x="755" y="396" font-size="19" text-anchor="middle" class="mono" font-weight="700">EdDSA</text><rect x="824" y="364" width="116" height="52" rx="10" fill="var(--acc-cry)" fill-opacity="0.18"/><rect x="824" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--acc-cry)" stroke-width="2.2"/><text x="882" y="396" font-size="18" text-anchor="middle" class="mono" font-weight="700">ML-DSA-44</text><rect x="951" y="364" width="116" height="52" rx="10" fill="var(--acc-cry)" fill-opacity="0.18"/><rect x="951" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--acc-cry)" stroke-width="2.2"/><text x="1009" y="396" font-size="18" text-anchor="middle" class="mono" font-weight="700">ML-DSA-65</text><rect x="1078" y="364" width="116" height="52" rx="10" fill="var(--acc-cry)" fill-opacity="0.18"/><rect x="1078" y="364" width="116" height="52" rx="10" fill="none" stroke="var(--acc-cry)" stroke-width="2.2"/><text x="1136" y="396" font-size="18" text-anchor="middle" class="mono" font-weight="700">ML-DSA-87</text><line x1="62" y1="434" x2="813" y2="434" class="hair" stroke-width="2"/><line x1="824" y1="434" x2="1194" y2="434" stroke="var(--acc-cry)" stroke-width="2.5" fill="none"/><text x="62" y="462" font-size="19" class="mut">classical</text><text x="824" y="462" font-size="19" style="fill:var(--acc-cry)" font-weight="600">post-quantum · FIPS 204</text><text x="1288" y="152" font-size="22" font-weight="700">Everything signed</text><rect x="1288" y="172" width="292" height="50" rx="10" fill="none" class="surf"/><rect x="1288" y="172" width="292" height="50" rx="10" fill="none" stroke="var(--acc-cry)" stroke-width="1.6"/><text x="1434" y="203.65" font-size="19" text-anchor="middle" font-weight="600">ID tokens</text><rect x="1288" y="234" width="292" height="50" rx="10" fill="none" class="surf"/><rect x="1288" y="234" width="292" height="50" rx="10" fill="none" stroke="var(--acc-cry)" stroke-width="1.6"/><text x="1434" y="265.65" font-size="19" text-anchor="middle" font-weight="600">Access tokens</text><rect x="1288" y="296" width="292" height="50" rx="10" fill="none" class="surf"/><rect x="1288" y="296" width="292" height="50" rx="10" fill="none" stroke="var(--acc-cry)" stroke-width="1.6"/><text x="1434" y="327.65" font-size="19" text-anchor="middle" font-weight="600">SD-JWT credentials</text><rect x="1288" y="358" width="292" height="50" rx="10" fill="none" class="surf"/><rect x="1288" y="358" width="292" height="50" rx="10" fill="none" stroke="var(--acc-cry)" stroke-width="1.6"/><text x="1434" y="389.65" font-size="19" text-anchor="middle" font-weight="600">Client assertions</text><rect x="1288" y="420" width="292" height="50" rx="10" fill="none" class="surf"/><rect x="1288" y="420" width="292" height="50" rx="10" fill="none" stroke="var(--acc-cry)" stroke-width="1.6"/><text x="1434" y="451.65" font-size="19" text-anchor="middle" font-weight="600">Identity assertions</text><line x1="1262" y1="226" x2="1280" y2="226" class="arrow-mut" marker-end="url(#ahm)"/><text x="1288" y="508" font-size="19" class="mut it">Change the key, and every</text><text x="1288" y="532" font-size="19" class="mut it">one of these changes with</text><text x="1288" y="556" font-size="19" class="mut it">it.</text><rect x="40" y="604" width="760" height="132" rx="12" fill="none" class="surf"/><rect x="40" y="604" width="760" height="132" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="2"/><circle cx="74" cy="642" r="15" fill="var(--acc-vc)"/><text x="74" y="649" font-size="18" text-anchor="middle" style="fill:var(--surf)" font-weight="700">✓</text><text x="102" y="649" font-size="22" font-weight="700">Shipped</text><text x="62" y="680" font-size="19" class="mut">ML-DSA signing per RFC 9881 key encoding and RFC 9964 JWS, published</text><text x="62" y="704" font-size="19" class="mut">as AKP JWKs at the JWKS endpoint.</text><rect x="828" y="604" width="752" height="132" rx="12" fill="none" class="surf"/><rect x="828" y="604" width="752" height="132" rx="12" fill="none" stroke="var(--mut)" stroke-width="2"/><circle cx="862" cy="642" r="15" fill="var(--mut)"/><text x="862" y="649" font-size="18" text-anchor="middle" style="fill:var(--surf)" font-weight="700">→</text><text x="890" y="649" font-size="22" font-weight="700">Not yet</text><text x="850" y="680" font-size="19" class="mut">Key encapsulation and hybrid modes. Encryption today is RSA-OAEP,</text><text x="850" y="704" font-size="19" class="mut">ECDH-ES, and AES-KW.</text><text x="1246" y="74" font-size="23" text-anchor="end" class="mut it">crypto-agility, not post-quantum everywhere</text><path d="M1010,86 Q950,108 900,160" class="arrow-mut" marker-end="url(#ahm)"/></svg>