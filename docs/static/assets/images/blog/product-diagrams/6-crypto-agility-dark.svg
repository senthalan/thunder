<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 780" width="1620" height="780" role="img" aria-label="One pluggable signer serves every token ThunderID issues, with ML-DSA available alongside the classical algorithms."><title>One pluggable signer serves every token ThunderID issues, with ML-DSA available alongside the classical algorithms.</title><style>
:root{--ink:#e6edf3;--mut:#9aa7b5;--surf:#0d1117;--line:#30363d;--acc-cfg:#6ea8fe;--acc-run:#2dd4bf;--acc-vc:#34d399;--acc-agt:#fbbf24;--acc-cry:#f87171;--acc-dat:#22d3ee;}
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: var(--ink); }
