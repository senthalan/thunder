<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 950" width="1620" height="950" role="img" aria-label="An agent is both an identity and an OAuth client; it can act as the subject of a token or as the actor on behalf of a user."><title>An agent is both an identity and an OAuth client; it can act as the subject of a token or as the actor on behalf of a user.</title><style>
:root{--ink:#e6edf3;--mut:#9aa7b5;--surf:#0d1117;--line:#30363d;--acc-cfg:#6ea8fe;--acc-run:#2dd4bf;--acc-vc:#34d399;--acc-agt:#fbbf24;--acc-cry:#f87171;--acc-dat:#22d3ee;}
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: var(--ink); }
.mut { fill: var(--mut); }
.b { font-weight: 700; }
.sb { font-weight: 600; }
.it { font-style: italic; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surf { fill: var(--surf); }
.pill-bg { fill: var(--ink); }
.pill-tx { fill: var(--surf); font-weight: 600; }
.hair { stroke: var(--line); fill: none; }
.arrow { stroke: var(--ink); fill: none; stroke-width: 2.2; }
.arrow-mut { stroke: var(--mut); fill: none; stroke-width: 2; }
.dash { stroke-dasharray: 8 7; }
.dot { stroke-dasharray: 2 6; stroke-linecap: round; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
  </marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--mut)"/>
  </marker>
  <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
  </marker>
</defs><rect x="44" y="150" width="380" height="480" rx="20" fill="var(--acc-agt)" fill-opacity="0.07"/><rect x="44" y="150" width="380" height="480" rx="20" fill="none" stroke="var(--acc-agt)" stroke-width="2.5"/><text x="66" y="198" font-size="34" style="fill:var(--acc-agt)" font-weight="700">Agent</text><text x="66" y="228" font-size="20" class="mut">one record, two natures</text><rect x="60" y="246" width="348" height="148" rx="12" fill="none" class="surf"/><rect x="60" y="246" width="348" height="148" rx="12" fill="none" stroke="var(--acc-agt)" stroke-width="1.4"/><text x="76" y="278" font-size="21" font-weight="700">as an identity</text><text x="76" y="308" font-size="19" class="mut mono">id · name · description</text><text x="76" y="335" font-size="19" class="mut mono">type (category: agent)</text><text x="76" y="362" font-size="19" class="mut mono">owner · ou · attributes</text><rect x="60" y="408" width="348" height="148" rx="12" fill="none" class="surf"/><rect x="60" y="408" width="348" height="148" rx="12" fill="none" stroke="var(--acc-agt)" stroke-width="1.4"/><text x="76" y="440" font-size="21" font-weight="700">as an OAuth client</text><text x="76" y="470" font-size="19" class="mut mono">client_id · client_secret</text><text x="76" y="497" font-size="19" class="mut mono">grant_types</text><text x="76" y="524" font-size="19" class="mut mono">redirect_uris</text><text x="66" y="590" font-size="19" class="mut it">No shadow service account to</text><text x="66" y="614" font-size="19" class="mut it">keep in sync.</text><rect x="44" y="664" width="380" height="132" rx="14" fill="none" class="pill-bg"/><text x="66" y="706" font-size="24" style="fill:var(--surf)" font-weight="700">MCP server</text><text x="66" y="736" font-size="19" style="fill:var(--surf)" opacity="0.78">Agents manage and query IAM here</text><text x="66" y="760" font-size="19" style="fill:var(--surf)" opacity="0.78">too, at /mcp.</text><text x="478" y="138" font-size="28" style="fill:var(--acc-cfg)" font-weight="700">Agent as subject</text><text x="752.3679999999999" y="138" font-size="20" class="mut">it acts for itself</text><rect x="478" y="200" width="168" height="92" rx="12" fill="none" class="surf"/><rect x="478" y="200" width="168" height="92" rx="12" fill="none" stroke="var(--acc-cfg)" stroke-width="2"/><text x="562" y="234" font-size="21" text-anchor="middle" font-weight="700">Agent</text><rect x="696" y="200" width="232" height="92" rx="12" fill="none" class="surf"/><rect x="696" y="200" width="232" height="92" rx="12" fill="none" stroke="var(--acc-cfg)" stroke-width="2"/><text x="812" y="234" font-size="21" text-anchor="middle" font-weight="700">client_credentials</text><rect x="980" y="178" width="258" height="136" rx="12" fill="none" class="surf"/><rect x="980" y="178" width="258" height="136" rx="12" fill="none" stroke="var(--acc-cfg)" stroke-width="2"/><text x="1109" y="212" font-size="21" text-anchor="middle" font-weight="700">Access token</text><text x="1109" y="240" font-size="19" text-anchor="middle" class="mut mono">sub = agent</text><text x="1109" y="266" font-size="19" text-anchor="middle" class="mut mono">no user involved</text><rect x="1312" y="200" width="244" height="92" rx="12" fill="none" class="surf"/><rect x="1312" y="200" width="244" height="92" rx="12" fill="none" stroke="var(--acc-cfg)" stroke-width="2"/><text x="1434" y="234" font-size="21" text-anchor="middle" font-weight="700">Resource server</text><line x1="650" y1="246" x2="692" y2="246" class="arrow-mut" marker-end="url(#ahm)"/><line x1="932" y1="246" x2="976" y2="246" class="arrow-mut" marker-end="url(#ahm)"/><line x1="1242" y1="246" x2="1308" y2="246" class="arrow-mut" marker-end="url(#ahm)"/><text x="940" y="348" font-size="19" class="mut">Scopes are the resource server's permissions intersected</text><text x="940" y="373" font-size="19" class="mut">with the agent's own role grants, then narrowed by the</text><text x="940" y="398" font-size="19" class="mut">requested resource.</text><line x1="460" y1="446" x2="1580" y2="446" class="hair dash" stroke-width="2"/><text x="478" y="512" font-size="28" style="fill:var(--acc-agt)" font-weight="700">Agent as actor</text><text x="720.322" y="512" font-size="20" class="mut">it acts for a user</text><rect x="478" y="566" width="168" height="84" rx="12" fill="none" class="surf"/><rect x="478" y="566" width="168" height="84" rx="12" fill="none" stroke="var(--acc-agt)" stroke-width="2"/><text x="562" y="600" font-size="21" text-anchor="middle" font-weight="700">User</text><rect x="478" y="664" width="168" height="84" rx="12" fill="none" class="surf"/><rect x="478" y="664" width="168" height="84" rx="12" fill="none" stroke="var(--acc-agt)" stroke-width="2"/><text x="562" y="698" font-size="21" text-anchor="middle" font-weight="700">Agent</text><rect x="696" y="566" width="232" height="84" rx="12" fill="none" class="surf"/><rect x="696" y="566" width="232" height="84" rx="12" fill="none" stroke="var(--acc-agt)" stroke-width="2"/><text x="812" y="600" font-size="21" text-anchor="middle" font-weight="700">Auth code + PKCE</text><rect x="696" y="664" width="232" height="84" rx="12" fill="none" class="surf"/><rect x="696" y="664" width="232" height="84" rx="12" fill="none" stroke="var(--acc-agt)" stroke-width="2"/><text x="812" y="698" font-size="21" text-anchor="middle" font-weight="700">User consent</text><rect x="980" y="566" width="258" height="182" rx="12" fill="none" class="surf"/><rect x="980" y="566" width="258" height="182" rx="12" fill="none" stroke="var(--acc-agt)" stroke-width="2"/><text x="1109" y="600" font-size="21" text-anchor="middle" font-weight="700">Access token</text><text x="1109" y="628" font-size="19" text-anchor="middle" class="mut mono">sub = user</text><text x="1109" y="654" font-size="19" text-anchor="middle" class="mut mono">act = agent</text><rect x="1312" y="615" width="244" height="84" rx="12" fill="none" class="surf"/><rect x="1312" y="615" width="244" height="84" rx="12" fill="none" stroke="var(--acc-agt)" stroke-width="2"/><text x="1434" y="649" font-size="21" text-anchor="middle" font-weight="700">Resource server</text><line x1="650" y1="608" x2="692" y2="608" class="arrow-mut" marker-end="url(#ahm)"/><line x1="650" y1="706" x2="692" y2="706" class="arrow-mut" marker-end="url(#ahm)"/><line x1="932" y1="608" x2="976" y2="608" class="arrow-mut" marker-end="url(#ahm)"/><line x1="932" y1="706" x2="976" y2="706" class="arrow-mut" marker-end="url(#ahm)"/><line x1="1242" y1="657" x2="1308" y2="657" class="arrow-mut" marker-end="url(#ahm)"/><text x="812" y="552" font-size="19" text-anchor="middle" class="mut">or token exchange</text><text x="478" y="800" font-size="19" class="mut">Effective permissions are the user's own</text><text x="478" y="825" font-size="19" class="mut">permissions intersected with exactly what the user</text><text x="478" y="850" font-size="19" class="mut">just consented to.</text><text x="1560" y="806" font-size="22" text-anchor="end" class="mut it">the act claim is</text><text x="1560" y="834" font-size="22" text-anchor="end" class="mut it">the whole difference</text><path d="M1330,796 Q1290,780 1250,752" class="arrow-mut" marker-end="url(#ahm)"/></svg>