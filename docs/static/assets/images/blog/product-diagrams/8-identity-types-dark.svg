<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 880" width="1620" height="880" role="img" aria-label="People, AI agents, and machines differ only in how they authenticate; underneath they share one directory, one authorization model, and one token model."><title>People, AI agents, and machines differ only in how they authenticate; underneath they share one directory, one authorization model, and one token model.</title><style>
:root{--ink:#e6edf3;--mut:#9aa7b5;--surf:#0d1117;--line:#30363d;--acc-cfg:#6ea8fe;--acc-run:#2dd4bf;--acc-vc:#34d399;--acc-agt:#fbbf24;--acc-cry:#f87171;--acc-dat:#22d3ee;}
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: var(--ink); }
.mut { fill: var(--mut); }
.b { font-weight: 700; }
.sb { font-weight: 600; }
.it { font-style: italic; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surf { fill: var(--surf); }
.pill-bg { fill: var(--ink); }
.pill-tx { fill: var(--surf); font-weight: 600; }
.hair { stroke: var(--line); fill: none; }
.arrow { stroke: var(--ink); fill: none; stroke-width: 2.2; }
.arrow-mut { stroke: var(--mut); fill: none; stroke-width: 2; }
.dash { stroke-dasharray: 8 7; }
.dot { stroke-dasharray: 2 6; stroke-linecap: round; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
  </marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--mut)"/>
  </marker>
  <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
  </marker>
</defs><rect x="40" y="90" width="480" height="450" rx="20" fill="var(--acc-cfg)" fill-opacity="0.05"/><rect x="40" y="90" width="480" height="450" rx="20" fill="none" stroke="var(--acc-cfg)" stroke-width="2.5"/><rect x="64" y="110" width="56" height="56" rx="14" fill="none" class="surf"/><rect x="64" y="110" width="56" height="56" rx="14" fill="none" stroke="var(--acc-cfg)" stroke-width="1.5"/><g transform="translate(77,123) scale(1.25)"><circle cx="12" cy="8" r="3.6" fill="none" stroke="var(--acc-cfg)" stroke-width="1.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="var(--acc-cfg)" stroke-width="1.8" stroke-linecap="round"/></g><text x="136" y="140" font-size="27" style="fill:var(--acc-cfg)" font-weight="700">People</text><text x="136" y="168" font-size="19" class="mut">customers, employees, admins</text><rect x="428.76" y="116" width="67.24000000000001" height="32" rx="8" fill="none" class="surf"/><rect x="428.76" y="116" width="67.24000000000001" height="32" rx="8" fill="none" stroke="var(--acc-cfg)" stroke-width="1.4"/><text x="462.38" y="138" font-size="18" text-anchor="middle" class="mono">user</text><rect x="64" y="194" width="249.455" height="32" rx="16" fill="none" class="pill-bg"/><text x="80" y="216.65" font-size="19" class="pill-tx">proves identity with</text><rect x="64" y="238" width="210" height="38" rx="10" fill="none" class="surf"/><rect x="64" y="238" width="210" height="38" rx="10" fill="none" stroke="var(--acc-cfg)" stroke-width="1.6"/><text x="169" y="262.95" font-size="17" text-anchor="middle" font-weight="600">Password</text><rect x="286" y="238" width="210" height="38" rx="10" fill="none" class="surf"/><rect x="286" y="238" width="210" height="38" rx="10" fill="none" stroke="var(--acc-cfg)" stroke-width="1.6"/><text x="391" y="262.95" font-size="17" text-anchor="middle" font-weight="600">Passkey</text><rect x="64" y="286" width="210" height="38" rx="10" fill="none" class="surf"/><rect x="64" y="286" width="210" height="38" rx="10" fill="none" stroke="var(--acc-cfg)" stroke-width="1.6"/><text x="169" y="310.95" font-size="17" text-anchor="middle" font-weight="600">Email OTP</text><rect x="286" y="286" width="210" height="38" rx="10" fill="none" class="surf"/><rect x="286" y="286" width="210" height="38" rx="10" fill="none" stroke="var(--acc-cfg)" stroke-width="1.6"/><text x="391" y="310.95" font-size="17" text-anchor="middle" font-weight="600">SMS OTP</text><rect x="64" y="334" width="210" height="38" rx="10" fill="none" class="surf"/><rect x="64" y="334" width="210" height="38" rx="10" fill="none" stroke="var(--acc-cfg)" stroke-width="1.6"/><text x="169" y="358.95" font-size="17" text-anchor="middle" font-weight="600">Social login</text><rect x="286" y="334" width="210" height="38" rx="10" fill="none" class="surf"/><rect x="286" y="334" width="210" height="38" rx="10" fill="none" stroke="var(--acc-cfg)" stroke-width="1.6"/><text x="391" y="358.95" font-size="17" text-anchor="middle" font-weight="600">Verifiable credential</text><text x="64" y="396" font-size="18" class="mut">Any of these, in any order, composed as a</text><text x="64" y="419" font-size="18" class="mut">journey.</text><line x1="64" y1="442" x2="496" y2="442" class="hair" stroke-width="1.5"/><text x="64" y="472" font-size="18" font-weight="700">In an access token</text><text x="64" y="498" font-size="18" class="mut">the person is the subject</text><line x1="280" y1="546" x2="280" y2="594" class="arrow-mut" marker-end="url(#ahm)"/><rect x="570" y="90" width="480" height="450" rx="20" fill="var(--acc-agt)" fill-opacity="0.05"/><rect x="570" y="90" width="480" height="450" rx="20" fill="none" stroke="var(--acc-agt)" stroke-width="2.5"/><rect x="594" y="110" width="56" height="56" rx="14" fill="none" class="surf"/><rect x="594" y="110" width="56" height="56" rx="14" fill="none" stroke="var(--acc-agt)" stroke-width="1.5"/><g transform="translate(607,123) scale(1.25)"><rect x="4" y="8" width="16" height="11" rx="3.2" fill="none" stroke="var(--acc-agt)" stroke-width="1.8"/><path d="M12 4.2v3.6M8.5 21h7" stroke="var(--acc-agt)" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="3.4" r="1.4" fill="var(--acc-agt)"/><circle cx="9.2" cy="13.4" r="1.3" fill="var(--acc-agt)"/><circle cx="14.8" cy="13.4" r="1.3" fill="var(--acc-agt)"/></g><text x="666" y="140" font-size="27" style="fill:var(--acc-agt)" font-weight="700">AI agents</text><text x="666" y="168" font-size="19" class="mut">copilots, autonomous workers</text><rect x="948.95" y="116" width="77.05000000000001" height="32" rx="8" fill="none" class="surf"/><rect x="948.95" y="116" width="77.05000000000001" height="32" rx="8" fill="none" stroke="var(--acc-agt)" stroke-width="1.4"/><text x="987.475" y="138" font-size="18" text-anchor="middle" class="mono">agent</text><rect x="594" y="194" width="249.455" height="32" rx="16" fill="none" class="pill-bg"/><text x="610" y="216.65" font-size="19" class="pill-tx">proves identity with</text><rect x="594" y="238" width="432" height="38" rx="10" fill="none" class="surf"/><rect x="594" y="238" width="432" height="38" rx="10" fill="none" stroke="var(--acc-agt)" stroke-width="1.6"/><text x="810" y="262.95" font-size="17" text-anchor="middle" font-weight="600">Client secret</text><rect x="594" y="286" width="432" height="38" rx="10" fill="none" class="surf"/><rect x="594" y="286" width="432" height="38" rx="10" fill="none" stroke="var(--acc-agt)" stroke-width="1.6"/><text x="810" y="310.95" font-size="17" text-anchor="middle" font-weight="600">Delegation from a person</text><text x="594" y="348" font-size="18" class="mut">Owned by a person or a team, and able to act</text><text x="594" y="371" font-size="18" class="mut">on their behalf.</text><line x1="594" y1="442" x2="1026" y2="442" class="hair" stroke-width="1.5"/><text x="594" y="472" font-size="18" font-weight="700">In an access token</text><text x="594" y="498" font-size="18" class="mut">the agent is the subject, or the actor for a</text><text x="594" y="521" font-size="18" class="mut">person</text><line x1="810" y1="546" x2="810" y2="594" class="arrow-mut" marker-end="url(#ahm)"/><rect x="1100" y="90" width="480" height="450" rx="20" fill="var(--acc-dat)" fill-opacity="0.05"/><rect x="1100" y="90" width="480" height="450" rx="20" fill="none" stroke="var(--acc-dat)" stroke-width="2.5"/><rect x="1124" y="110" width="56" height="56" rx="14" fill="none" class="surf"/><rect x="1124" y="110" width="56" height="56" rx="14" fill="none" stroke="var(--acc-dat)" stroke-width="1.5"/><g transform="translate(1137,123) scale(1.25)"><rect x="3.5" y="4" width="17" height="5.6" rx="1.8" fill="none" stroke="var(--acc-dat)" stroke-width="1.8"/><rect x="3.5" y="14.4" width="17" height="5.6" rx="1.8" fill="none" stroke="var(--acc-dat)" stroke-width="1.8"/><circle cx="7" cy="6.8" r="1.1" fill="var(--acc-dat)"/><circle cx="7" cy="17.2" r="1.1" fill="var(--acc-dat)"/></g><text x="1196" y="140" font-size="27" style="fill:var(--acc-dat)" font-weight="700">Machines</text><text x="1196" y="168" font-size="19" class="mut">services, jobs, integrations</text><rect x="1498.57" y="116" width="57.43000000000001" height="32" rx="8" fill="none" class="surf"/><rect x="1498.57" y="116" width="57.43000000000001" height="32" rx="8" fill="none" stroke="var(--acc-dat)" stroke-width="1.4"/><text x="1527.285" y="138" font-size="18" text-anchor="middle" class="mono">app</text><rect x="1124" y="194" width="249.455" height="32" rx="16" fill="none" class="pill-bg"/><text x="1140" y="216.65" font-size="19" class="pill-tx">proves identity with</text><rect x="1124" y="238" width="432" height="38" rx="10" fill="none" class="surf"/><rect x="1124" y="238" width="432" height="38" rx="10" fill="none" stroke="var(--acc-dat)" stroke-width="1.6"/><text x="1340" y="262.95" font-size="17" text-anchor="middle" font-weight="600">Client secret</text><text x="1124" y="300" font-size="18" class="mut">No interactive login. It authenticates as</text><text x="1124" y="323" font-size="18" class="mut">itself.</text><line x1="1124" y1="442" x2="1556" y2="442" class="hair" stroke-width="1.5"/><text x="1124" y="472" font-size="18" font-weight="700">In an access token</text><text x="1124" y="498" font-size="18" class="mut">the service is the subject</text><line x1="1340" y1="546" x2="1340" y2="594" class="arrow-mut" marker-end="url(#ahm)"/><rect x="40" y="600" width="1540" height="240" rx="20" fill="var(--acc-run)" fill-opacity="0.06"/><rect x="40" y="600" width="1540" height="240" rx="20" fill="none" stroke="var(--acc-run)" stroke-width="2.5"/><text x="810" y="652" font-size="30" text-anchor="middle" style="fill:var(--acc-run)" font-weight="700">The same model underneath</text><rect x="64" y="676" width="484" height="110" rx="12" fill="none" class="surf"/><rect x="64" y="676" width="484" height="110" rx="12" fill="none" stroke="var(--acc-run)" stroke-width="1.5"/><text x="84" y="708" font-size="22" font-weight="700">One directory</text><text x="84" y="736" font-size="18" class="mut">All three are stored as entities, with the</text><text x="84" y="759" font-size="18" class="mut">same lifecycle and the same APIs.</text><rect x="568" y="676" width="484" height="110" rx="12" fill="none" class="surf"/><rect x="568" y="676" width="484" height="110" rx="12" fill="none" stroke="var(--acc-run)" stroke-width="1.5"/><text x="588" y="708" font-size="22" font-weight="700">One authorization model</text><text x="588" y="736" font-size="18" class="mut">Roles assign to a person, an agent, a</text><text x="588" y="759" font-size="18" class="mut">machine, or a group alike.</text><rect x="1072" y="676" width="484" height="110" rx="12" fill="none" class="surf"/><rect x="1072" y="676" width="484" height="110" rx="12" fill="none" stroke="var(--acc-run)" stroke-width="1.5"/><text x="1092" y="708" font-size="22" font-weight="700">One token model</text><text x="1092" y="736" font-size="18" class="mut">Any of the three can be the subject that a</text><text x="1092" y="759" font-size="18" class="mut">resource server checks.</text><text x="810" y="818" font-size="19" text-anchor="middle" class="mut it">People and agents also carry schema-driven types, so their attributes are yours to define.</text></svg>