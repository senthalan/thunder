<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 880" width="1620" height="880" role="img" aria-label="ThunderID issues credentials over OpenID4VCI and verifies them over OpenID4VP, with verification usable standalone or as a step inside a login journey."><title>ThunderID issues credentials over OpenID4VCI and verifies them over OpenID4VP, with verification usable standalone or as a step inside a login journey.</title><style>
:root{--ink:#0f172a;--mut:#64748b;--surf:#ffffff;--line:#cbd5e1;--acc-cfg:#2563eb;--acc-run:#0d9488;--acc-vc:#059669;--acc-agt:#b45309;--acc-cry:#dc2626;--acc-dat:#0e7490;}
text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: var(--ink); }
.mut { fill: var(--mut); }
.b { font-weight: 700; }
.sb { font-weight: 600; }
.it { font-style: italic; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.surf { fill: var(--surf); }
.pill-bg { fill: var(--ink); }
.pill-tx { fill: var(--surf); font-weight: 600; }
.hair { stroke: var(--line); fill: none; }
.arrow { stroke: var(--ink); fill: none; stroke-width: 2.2; }
.arrow-mut { stroke: var(--mut); fill: none; stroke-width: 2; }
.dash { stroke-dasharray: 8 7; }
.dot { stroke-dasharray: 2 6; stroke-linecap: round; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
  </marker>
  <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--mut)"/>
  </marker>
  <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
  </marker>
</defs><rect x="40" y="130" width="520" height="470" rx="20" fill="var(--acc-vc)" fill-opacity="0.07"/><rect x="40" y="130" width="520" height="470" rx="20" fill="none" stroke="var(--acc-vc)" stroke-width="2.5"/><text x="62" y="176" font-size="30" style="fill:var(--acc-vc)" font-weight="700">ThunderID</text><text x="62" y="206" font-size="20" class="mut">as issuer · OpenID4VCI</text><rect x="56" y="226" width="488" height="74" rx="12" fill="none" class="surf"/><rect x="56" y="226" width="488" height="74" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="1.5"/><circle cx="86" cy="263" r="16" fill="var(--acc-vc)"/><text x="86" y="270" font-size="19" text-anchor="middle" style="fill:var(--surf)" font-weight="700">1</text><text x="114" y="258" font-size="21" font-weight="700">Credential offer</text><text x="114" y="283" font-size="18" class="mut mono">GET /openid4vci/offer</text><rect x="56" y="310" width="488" height="74" rx="12" fill="none" class="surf"/><rect x="56" y="310" width="488" height="74" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="1.5"/><circle cx="86" cy="347" r="16" fill="var(--acc-vc)"/><text x="86" y="354" font-size="19" text-anchor="middle" style="fill:var(--surf)" font-weight="700">2</text><text x="114" y="342" font-size="21" font-weight="700">Authorization code grant</text><text x="114" y="367" font-size="18" class="mut mono">the credential config is the scope</text><rect x="56" y="394" width="488" height="74" rx="12" fill="none" class="surf"/><rect x="56" y="394" width="488" height="74" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="1.5"/><circle cx="86" cy="431" r="16" fill="var(--acc-vc)"/><text x="86" y="438" font-size="19" text-anchor="middle" style="fill:var(--surf)" font-weight="700">3</text><text x="114" y="426" font-size="21" font-weight="700">Nonce</text><text x="114" y="451" font-size="18" class="mut mono">POST /openid4vci/nonce</text><rect x="56" y="478" width="488" height="74" rx="12" fill="none" class="surf"/><rect x="56" y="478" width="488" height="74" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="1.5"/><circle cx="86" cy="515" r="16" fill="var(--acc-vc)"/><text x="86" y="522" font-size="19" text-anchor="middle" style="fill:var(--surf)" font-weight="700">4</text><text x="114" y="510" font-size="21" font-weight="700">Issue credential</text><text x="114" y="535" font-size="18" class="mut mono">POST /openid4vci/credential</text><rect x="620" y="190" width="380" height="350" rx="20" fill="none" stroke="var(--mut)" stroke-width="2.5" stroke-dasharray="6 6"/><text x="810" y="242" font-size="32" text-anchor="middle" font-weight="700">Wallet</text><text x="810" y="274" font-size="19" text-anchor="middle" class="mut">external: ThunderID ships no wallet</text><rect x="648" y="302" width="324" height="126" rx="12" fill="none" class="surf"/><rect x="648" y="302" width="324" height="126" rx="12" fill="none" stroke="var(--mut)" stroke-width="1.4"/><text x="810" y="334" font-size="21" text-anchor="middle" font-weight="700">holder key</text><text x="664" y="362" font-size="18" class="mut">a cnf JWK binds each</text><text x="664" y="385" font-size="18" class="mut">credential to the key the</text><text x="664" y="408" font-size="18" class="mut">holder proved</text><rect x="648" y="444" width="324" height="44" rx="10" fill="none" class="surf"/><rect x="648" y="444" width="324" height="44" rx="10" fill="none" stroke="var(--acc-vc)" stroke-width="1.6"/><text x="810" y="472.65" font-size="19" text-anchor="middle" font-weight="600">dc+sd-jwt</text><text x="810" y="516" font-size="18" text-anchor="middle" class="mut">selective disclosure: show age, not birthdate</text><rect x="1060" y="130" width="520" height="470" rx="20" fill="var(--acc-vc)" fill-opacity="0.07"/><rect x="1060" y="130" width="520" height="470" rx="20" fill="none" stroke="var(--acc-vc)" stroke-width="2.5"/><text x="1082" y="176" font-size="30" style="fill:var(--acc-vc)" font-weight="700">ThunderID</text><text x="1082" y="206" font-size="20" class="mut">as verifier · OpenID4VP</text><rect x="1076" y="226" width="488" height="74" rx="12" fill="none" class="surf"/><rect x="1076" y="226" width="488" height="74" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="1.5"/><circle cx="1106" cy="263" r="16" fill="var(--acc-vc)"/><text x="1106" y="270" font-size="19" text-anchor="middle" style="fill:var(--surf)" font-weight="700">1</text><text x="1134" y="258" font-size="21" font-weight="700">Request</text><text x="1134" y="283" font-size="18" class="mut mono">signed request URI</text><rect x="1076" y="310" width="488" height="74" rx="12" fill="none" class="surf"/><rect x="1076" y="310" width="488" height="74" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="1.5"/><circle cx="1106" cy="347" r="16" fill="var(--acc-vc)"/><text x="1106" y="354" font-size="19" text-anchor="middle" style="fill:var(--surf)" font-weight="700">2</text><text x="1134" y="342" font-size="21" font-weight="700">Query</text><text x="1134" y="367" font-size="18" class="mut mono">DCQL selects the claims</text><rect x="1076" y="394" width="488" height="74" rx="12" fill="none" class="surf"/><rect x="1076" y="394" width="488" height="74" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="1.5"/><circle cx="1106" cy="431" r="16" fill="var(--acc-vc)"/><text x="1106" y="438" font-size="19" text-anchor="middle" style="fill:var(--surf)" font-weight="700">3</text><text x="1134" y="426" font-size="21" font-weight="700">Response</text><text x="1134" y="451" font-size="18" class="mut mono">wallet posts to the response URI</text><rect x="1076" y="478" width="488" height="74" rx="12" fill="none" class="surf"/><rect x="1076" y="478" width="488" height="74" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="1.5"/><circle cx="1106" cy="515" r="16" fill="var(--acc-vc)"/><text x="1106" y="522" font-size="19" text-anchor="middle" style="fill:var(--surf)" font-weight="700">4</text><text x="1134" y="510" font-size="21" font-weight="700">Validate</text><text x="1134" y="535" font-size="18" class="mut mono">x5c chain against trust anchors</text><line x1="568" y1="366" x2="612" y2="366" class="arrow" marker-end="url(#ah)"/><rect x="550.935" y="316" width="78.13" height="32" rx="8" fill="none" class="surf"/><text x="590" y="338" font-size="19" text-anchor="middle" class="mut">issues</text><line x1="1008" y1="366" x2="1052" y2="366" class="arrow" marker-end="url(#ah)"/><rect x="980.58" y="316" width="98.84" height="32" rx="8" fill="none" class="surf"/><text x="1030" y="338" font-size="19" text-anchor="middle" class="mut">presents</text><text x="56" y="644" font-size="22" font-weight="700">Batch issuance</text><text x="56" y="674" font-size="19" class="mut">One request carries many holder proofs, so the</text><text x="56" y="699" font-size="19" class="mut">wallet gets one credential per key and</text><text x="56" y="724" font-size="19" class="mut">presentations cannot be correlated.</text><text x="1076" y="644" font-size="22" font-weight="700">Trust, not just signature</text><text x="1076" y="674" font-size="19" class="mut">Presentations are checked against configured</text><text x="1076" y="699" font-size="19" class="mut">root CAs, so an unknown issuer is rejected</text><text x="1076" y="724" font-size="19" class="mut">rather than merely noted.</text><rect x="700" y="774" width="74" height="52" rx="12" fill="var(--mut)" fill-opacity="0.1"/><rect x="700" y="774" width="74" height="52" rx="12" fill="none" stroke="var(--mut)" stroke-width="1.5"/><text x="737" y="807" font-size="19" text-anchor="middle" font-weight="700">START</text><line x1="777" y1="800" x2="801" y2="800" class="arrow-mut" marker-end="url(#ahm)"/><rect x="804" y="774" width="140" height="52" rx="12" fill="var(--acc-cfg)" fill-opacity="0.1"/><rect x="804" y="774" width="140" height="52" rx="12" fill="none" stroke="var(--acc-cfg)" stroke-width="1.5"/><text x="874" y="807" font-size="19" text-anchor="middle" font-weight="700">Identify</text><line x1="947" y1="800" x2="971" y2="800" class="arrow-mut" marker-end="url(#ahm)"/><rect x="974" y="774" width="176" height="52" rx="12" fill="var(--acc-vc)" fill-opacity="0.2"/><rect x="974" y="774" width="176" height="52" rx="12" fill="none" stroke="var(--acc-vc)" stroke-width="2.4"/><text x="1062" y="807" font-size="19" text-anchor="middle" font-weight="700">OpenID4VP</text><line x1="1153" y1="800" x2="1177" y2="800" class="arrow-mut" marker-end="url(#ahm)"/><rect x="1180" y="774" width="130" height="52" rx="12" fill="var(--acc-cfg)" fill-opacity="0.1"/><rect x="1180" y="774" width="130" height="52" rx="12" fill="none" stroke="var(--acc-cfg)" stroke-width="1.5"/><text x="1245" y="807" font-size="19" text-anchor="middle" font-weight="700">Consent</text><line x1="1313" y1="800" x2="1337" y2="800" class="arrow-mut" marker-end="url(#ahm)"/><rect x="1340" y="774" width="74" height="52" rx="12" fill="var(--mut)" fill-opacity="0.1"/><rect x="1340" y="774" width="74" height="52" rx="12" fill="none" stroke="var(--mut)" stroke-width="1.5"/><text x="1377" y="807" font-size="19" text-anchor="middle" font-weight="700">END</text><text x="40" y="794" font-size="20" class="mut it">Verification is also just a node: drop it into any login</text><text x="40" y="820" font-size="20" class="mut it">journey.</text></svg>